<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Cadastro</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="kim.js" defer></script>
</head>
<body class="d-flex flex-column min-vh-100">

  <!-- CABEÇALHO -->
  <header class="py-3 mb-4" style="background-color: var(--navy-dark); border-bottom: 3px solid var(--orange-hover);">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Cadastro de Usuário</h4>
      </div>
      <a href="login.html" class="btn btn-outline-light rounded-pill px-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Já tenho conta
      </a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container my-auto pb-5">
    <div class="row align-items-center justify-content-center g-4">
      
      <!-- BANNER / LOGO -->
      <div class="col-md-6 col-lg-5 text-center">
        <div class="p-4 bg-white rounded-4 shadow-sm d-inline-block">
          <img src="LOGO1.png" alt="Kartódromo Internacional de Mauá" class="img-fluid" style="max-height: 300px; object-fit: contain;">
        </div>
      </div>

      <!-- FORMULÁRIO DE CADASTRO -->
      <div class="col-md-6 col-lg-5">
        <div class="container-card m-0">
          <h2>Criar Conta</h2>
          
          <form id="cadastroForm">
            <label for="usuario">Usuário</label>
            <input type="text" id="usuario" placeholder="Digite seu usuário" required>

            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="seuemail@exemplo.com" required>

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="••••••••" required>

            <label for="confirmarSenha">Confirmar Senha</label>
            <input type="password" id="confirmarSenha" placeholder="••••••••" required>

            <button type="submit" class="btn-salvar w-100 mt-3">
              <i class="bi bi-person-plus-fill me-1"></i> Cadastrar
            </button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <script>
    document.getElementById('cadastroForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usuario = document.getElementById('usuario').value;
      const email = document.getElementById('email').value;
      const senha = document.getElementById('senha').value;
      const confirmarSenha = document.getElementById('confirmarSenha').value;

      if (senha !== confirmarSenha) {
        alert('As senhas não coincidem!');
        return;
      }

      try {
        const response = await fetch('http://localhost:3000/api/usuarios', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ usuario, email, senha })
        });

        const data = await response.json();

        if (response.ok) {
          alert('Usuário cadastrado com sucesso!');
          window.location.href = 'login.html';
        } else {
          alert('Erro: ' + (data.error || 'Não foi possível cadastrar'));
        }
      } catch (error) {
        console.error('Erro na requisição:', error);
        alert('Falha ao conectar com a API.');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
