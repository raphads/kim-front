<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Gestão de Campeonatos</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="py-3 mb-4" style="background-color: var(--navy-dark); border-bottom: 3px solid var(--orange-hover);">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Gestão de Campeonatos</h4>
      </div>
      <div class="d-flex gap-2">
        <a href="podio.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-trophy-fill me-1"></i> Definir Pódio
        </a>
        <a href="piloto.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-person-badge-fill me-1"></i> Pilotos
        </a>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container mb-5">
    <div class="row g-4">
      
      <!-- FORMULÁRIO -->
      <div class="col-lg-4">
        <div class="container-card">
          <h2>Novo Campeonato</h2>
          <form id="formCampeonato">
            <label for="nome">Nome do Campeonato</label>
            <input type="text" id="nome" placeholder="Ex: Copa Mauá 2026" required>

            <label for="voltas">Nº de Voltas</label>
            <input type="number" id="voltas" placeholder="Ex: 25" min="1" required>

            <label for="dataInicio">Data de Realização</label>
            <input type="date" id="dataInicio" required>

            <button type="submit" class="btn-salvar w-100 mt-2">
              <i class="bi bi-plus-circle-fill me-1"></i> Cadastrar Torneio
            </button>
          </form>
        </div>
      </div>

      <!-- TABELA -->
      <div class="col-lg-8">
        <div class="container-tabela">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Campeonatos Cadastrados</h2>
          </div>
          
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Nome</th>
                  <th>Voltas</th>
                  <th>Data</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaCampeonatos">
                <!-- Preenchido via JS -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api/campeonatos';

    // 1. Listar Campeonatos (GET)
    async function carregarCampeonatos() {
      try {
        const res = await fetch(API_URL);
        const campeonatos = await res.json();
        
        const tbody = document.getElementById('tabelaCampeonatos');
        if (!campeonatos || campeonatos.length === 0) {
          tbody.innerHTML = '<tr><td colspan="4" class="text-center text-muted py-3">Nenhum campeonato cadastrado.</td></tr>';
          return;
        }

        tbody.innerHTML = campeonatos.map(c => `
          <tr>
            <td><strong>${c.nome}</strong></td>
            <td><span class="badge bg-primary fs-6">${c.voltas || 0} voltas</span></td>
            <td>${c.dataInicio ? new Date(c.dataInicio).toLocaleDateString('pt-BR') : '-'}</td>
            <td>
              <button class="btn-delete" onclick="deletarCampeonato('${c.id || c.nome}')">
                <i class="bi bi-trash-fill"></i> Excluir
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Erro ao carregar campeonatos:', err);
      }
    }

    // 2. Salvar Campeonato (POST)
    document.getElementById('formCampeonato').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const campeonato = {
        nome: document.getElementById('nome').value,
        voltas: Number(document.getElementById('voltas').value),
        dataInicio: document.getElementById('dataInicio').value
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(campeonato)
        });

        e.target.reset();
        carregarCampeonatos();
      } catch (err) {
        alert('Erro ao salvar campeonato no servidor.');
      }
    });

    // 3. Excluir Campeonato (DELETE)
    async function deletarCampeonato(id) {
      if (confirm('Deseja realmente excluir este campeonato?')) {
        try {
          await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
          carregarCampeonatos();
        } catch (err) {
          alert('Erro ao excluir campeonato.');
        }
      }
    }

    carregarCampeonatos();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
