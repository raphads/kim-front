<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Gestão de Funcionários</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="kim.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.7/jquery.inputmask.min.js"></script>
</head>
<body>

  <header class="py-3 mb-4" style="background-color: var(--navy-dark); border-bottom: 3px solid var(--orange-hover);">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Gestão de Funcionários</h4>
      </div>
      <div class="d-flex gap-2">
        <a href="piloto.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-flag-fill me-1"></i> Pilotos
        </a>
        <a href="index.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-house-door-fill me-1"></i> Início
        </a>
      </div>
    </div>
  </header>

  <main class="container mb-5">
    <div class="row g-4">
      
      <!-- Formulário de Cadastro -->
      <div class="col-12">
        <div class="container-card">
          <h2>Cadastrar Funcionário</h2>
          <form id="formFuncionario">
            
            <div class="row mb-2">
              <div class="col-md-4 mb-2">
                <label for="cpf" class="form-label mb-1">CPF</label>
                <input type="text" id="cpf" class="form-control" placeholder="000.000.000-00" required>
              </div>
              <div class="col-md-8 mb-2">
                <label for="nome" class="form-label mb-1">Nome Completo</label>
                <input type="text" id="nome" class="form-control" placeholder="Nome do funcionário" required>
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-6 mb-2">
                <label for="email" class="form-label mb-1">E-mail</label>
                <input type="email" id="email" class="form-control" placeholder="email@exemplo.com" required>
              </div>
              <div class="col-md-6 mb-2">
                <label for="dataNasc" class="form-label mb-1">Data de Nascimento</label>
                <input type="date" id="dataNasc" class="form-control" required>
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-6 mb-2">
                <label for="cargo" class="form-label mb-1">Cargo / Função</label>
                <select id="cargo" name="cargo" class="form-select" required>
                  <option value="" disabled selected>Selecione...</option>
                  <option value="Mecânico">Mecânico</option>
                  <option value="Atendente">Atendente</option>
                  <option value="Socorrista">Socorrista</option>
                  <option value="Fiscal de Pista">Fiscal de Pista</option>
                  <option value="Cronometrista">Cronometrista</option>
                  <option value="Gerente">Gerente</option>
                  <option value="Faxineiro">Faxineiro</option>
                </select>
              </div>
              <div class="col-md-6 mb-2">
                <label for="salario" class="form-label mb-1">Salário (R$)</label>
                <input type="number" id="salario" class="form-control" step="0.01" min="0" placeholder="0.00" required>
              </div>
            </div>

            <div class="mb-2">
              <label for="foto" class="form-label mb-1">URL da Foto (Opcional)</label>
              <input type="url" id="foto" class="form-control" placeholder="https://exemplo.com/foto.jpg">
            </div>

            <!-- Seção do Endereço -->
            <hr class="my-3">
            <h6 class="fw-bold mb-2">Endereço</h6>

            <div class="row mb-2">
              <div class="col-md-4 mb-2">
                <label for="cep" class="form-label mb-1">CEP</label>
                <input type="text" id="cep" class="form-control" placeholder="00000-000" maxlength="9" required>
              </div>
              <div class="col-md-6 mb-2">
                <label for="logradouro" class="form-label mb-1">Logradouro (Rua/Av.)</label>
                <input type="text" id="logradouro" class="form-control" required>
              </div>
              <div class="col-md-2 mb-2">
                <label for="numero" class="form-label mb-1">Número</label>
                <input type="text" id="numero" class="form-control" placeholder="123" required>
              </div>
            </div>

            <div class="row mb-2">
              <div class="col-md-5 mb-2">
                <label for="bairro" class="form-label mb-1">Bairro</label>
                <input type="text" id="bairro" class="form-control" required>
              </div>
              <div class="col-md-5 mb-2">
                <label for="cidade" class="form-label mb-1">Cidade</label>
                <input type="text" id="cidade" class="form-control" required>
              </div>
              <div class="col-md-2 mb-2">
                <label for="uf" class="form-label mb-1">UF</label>
                <input type="text" id="uf" class="form-control text-uppercase" maxlength="2" required>
              </div>
            </div>

            <button type="submit" class="btn-salvar w-100 mt-3">
              <i class="bi bi-check-circle-fill me-1"></i> Salvar Funcionário
            </button>
          </form>
        </div>
      </div>

      <!-- Tabela de Listagem -->
      <div class="col-12">
        <div class="container-tabela">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Quadro de Funcionários</h2>
          </div>
          
          <div class="table-responsive">
            <table class="table align-middle text-nowrap">
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>CPF</th>
                  <th>Nome</th>
                  <th>E-mail</th>
                  <th>Data Nasc.</th>
                  <th>Cargo</th>
                  <th>Salário</th>
                  <th>CEP</th>
                  <th>Logradouro</th>
                  <th>Nº</th>
                  <th>Bairro</th>
                  <th>Cidade</th>
                  <th>UF</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaFuncionarios">
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api/funcionarios';

    // Aplicação das máscaras no formulário
    $(document).ready(function() {
      $('#cpf').inputmask('999.999.999-99');
      $('#cep').inputmask('99999-999');
    });

    // Formatar data em PT-BR
    function formatarData(dataIso) {
      if (!dataIso) return '-';
      const data = new Date(dataIso);
      return isNaN(data.getTime()) ? dataIso : data.toLocaleDateString('pt-BR', { timeZone: 'UTC' });
    }

    // 🔍 Integração ViaCEP
    document.getElementById('cep').addEventListener('blur', async (e) => {
      const cep = e.target.value.replace(/\D/g, '');
      if (cep.length !== 8) return;

      try {
        const res = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const data = await res.json();

        if (data.erro) {
          alert('CEP não encontrado.');
          return;
        }

        document.getElementById('logradouro').value = data.logradouro || '';
        document.getElementById('bairro').value = data.bairro || '';
        document.getElementById('cidade').value = data.localidade || '';
        document.getElementById('uf').value = data.uf || '';
        document.getElementById('numero').focus();
      } catch (err) {
        console.error('Erro ao consultar ViaCEP:', err);
      }
    });

    // 1. Listar Funcionários (GET)
    async function carregarFuncionarios() {
      const tbody = document.getElementById('tabelaFuncionarios');
      
      try {
        const res = await fetch(API_URL);
        const funcionarios = await res.json();
        
        if (!Array.isArray(funcionarios) || funcionarios.length === 0) {
          tbody.innerHTML = '<tr><td colspan="14" class="text-center text-muted py-3">Nenhum funcionário cadastrado.</td></tr>';
          return;
        }

        tbody.innerHTML = funcionarios.map(f => {
          const fotoImg = f.foto 
            ? `<img src="${f.foto}" alt="${f.nome}" class="rounded-circle" width="40" height="40" style="object-fit: cover;">`
            : `<i class="bi bi-person-circle fs-3 text-secondary"></i>`;

          return `
            <tr>
              <td class="text-center">${fotoImg}</td>
              <td><strong>${f.cpf || '-'}</strong></td>
              <td>${f.nome || '-'}</td>
              <td>${f.email || '-'}</td>
              <td>${formatarData(f.dataNasc)}</td>
              <td><span class="badge bg-primary fs-6">${f.cargo || '-'}</span></td>
              <td>R$ ${Number(f.salario || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
              <td>${f.cep || '-'}</td>
              <td>${f.logradouro || '-'}</td>
              <td>${f.numero || '-'}</td>
              <td>${f.bairro || '-'}</td>
              <td>${f.cidade || '-'}</td>
              <td>${f.uf || '-'}</td>
              <td>
                <button class="btn-delete" onclick="deletarFuncionario('${f.cpf}')">
                  <i class="bi bi-trash-fill"></i> Excluir
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Erro ao carregar funcionários:', err);
        tbody.innerHTML = '<tr><td colspan="14" class="text-center text-danger py-3">Erro ao conectar com o servidor.</td></tr>';
      }
    }

    // 2. Salvar Funcionário (POST) - Envia o CPF COM Máscara e dispara os Alertas
    document.getElementById('formFuncionario').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const salarioValor = parseFloat(document.getElementById('salario').value);
      const dataNascInput = document.getElementById('dataNasc').value;

      if (isNaN(salarioValor) || salarioValor < 0) {
        alert('O salário não pode ser negativo.');
        return;
      }

      const funcionario = {
        cpf: document.getElementById('cpf').value.trim(), // Envia o CPF COM a máscara (ex: 123.456.789-00)
        nome: document.getElementById('nome').value.trim(),
        email: document.getElementById('email').value.trim(),
        dataNasc: new Date(dataNascInput).toISOString(),
        cargo: document.getElementById('cargo').value,
        salario: salarioValor,
        foto: document.getElementById('foto').value.trim() || null,
        cep: document.getElementById('cep').value.trim(),
        logradouro: document.getElementById('logradouro').value.trim(),
        numero: document.getElementById('numero').value.trim(),
        bairro: document.getElementById('bairro').value.trim(),
        cidade: document.getElementById('cidade').value.trim(),
        uf: document.getElementById('uf').value.trim().toUpperCase()
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(funcionario)
        });

        if (response.ok) {
          alert('Funcionário cadastrado com sucesso!');
          e.target.reset();
          carregarFuncionarios();
        } else {
          const erro = await response.json();
          alert(`Erro ao salvar: ${erro.message || 'Verifique os dados informados.'}`);
        }
      } catch (err) {
        alert('Erro de conexão com o servidor ao tentar salvar.');
      }
    });

    // 3. Excluir Funcionário (DELETE)
    async function deletarFuncionario(cpf) {
      if (confirm(`Deseja realmente excluir o funcionário com CPF ${cpf}?`)) {
        try {
          const response = await fetch(`${API_URL}/${encodeURIComponent(cpf)}`, { method: 'DELETE' });
          if (response.ok) {
            alert('Funcionário excluído com sucesso!');
            carregarFuncionarios();
          } else {
            alert('Não foi possível excluir o funcionário.');
          }
        } catch (err) {
          alert('Erro ao conectar com o servidor ao excluir.');
        }
      }
    }

    carregarFuncionarios();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
