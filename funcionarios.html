<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Gestão de Funcionários</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">
  <script src="kim.js" defer></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.7/jquery.inputmask.min.js"></script>
</head>
<body>

  <header class="py-3 mb-4" style="background-color: var(--navy-dark); border-bottom: 3px solid var(--orange-hover);">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Gestão de Funcionários</h4>
      </div>
      <div class="d-flex gap-2">
        <a href="piloto.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-flag-fill me-1"></i> Pilotos
        </a>
        <a href="index.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-house-door-fill me-1"></i> Início
        </a>
      </div>
    </div>
  </header>

  <main class="container mb-5">
    <div class="row g-4">
      
      <div class="col-lg-4">
        <div class="container-card">
          <h2>Cadastrar Funcionário</h2>
          <form id="formFuncionario">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Nome do funcionário" required>

            <label for="cargo">Cargo / Função</label>
            <select id="cargo" name="cargo" class="form-select mb-3" required>
              <option value="" disabled selected>Selecione o cargo...</option>
              <option value="Mecânico">Mecânico</option>
              <option value="Atendente">Atendente</option>
              <option value="Socorrista">Socorrista</option>
              <option value="Fiscal de Pista">Fiscal de Pista</option>
              <option value="Cronometrista">Cronometrista</option>
              <option value="Gerente">Gerente</option>
              <option value="Faxineiro">Faxineiro</option>
            </select>

            <div class="mb-3">
              <label for="salario">Salário (R$)</label>
              <input type="number" id="salario" step="0.01" min="0" placeholder="0.00" required>
            </div>

            <button type="submit" class="btn-salvar w-100 mt-2">
              <i class="bi bi-check-circle-fill me-1"></i> Salvar Funcionário
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="container-tabela">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Quadro de Funcionários</h2>
          </div>
          
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>CPF</th>
                  <th>Nome</th>
                  <th>Cargo</th>
                  <th>Salário</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaFuncionarios">
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api/funcionarios';

    // 1. Listar Funcionários (GET)
    async function carregarFuncionarios() {
      const tbody = document.getElementById('tabelaFuncionarios');
      
      try {
        const res = await fetch(API_URL);
        const funcionarios = await res.json();
        
        // Proteção para evitar falha no layout caso o servidor responda um erro em formato de objeto
        if (!Array.isArray(funcionarios) || funcionarios.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">Nenhum funcionário cadastrado.</td></tr>';
          return;
        }

        tbody.innerHTML = funcionarios.map(f => `
          <tr>
            <td><strong>${f.cpf}</strong></td>
            <td>${f.nome}</td>
            <td><span class="badge bg-primary fs-6">${f.cargo || '-'}</span></td>
            <td>R$ ${Number(f.salario || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
            <td>
              <button class="btn-delete" onclick="deletarFuncionario('${f.cpf}')">
                <i class="bi bi-trash-fill"></i> Excluir
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Erro ao carregar funcionários:', err);
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-danger py-3">Erro ao conectar com o servidor.</td></tr>';
      }
    }

    // 2. Salvar Funcionário (POST)
    document.getElementById('formFuncionario').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const cargoSelecionado = document.getElementById('cargo').value;
      const salarioInput = document.getElementById('salario').value;
      const salarioValor = parseFloat(salarioInput);

      if (!cargoSelecionado) {
        alert('Por favor, selecione um cargo válido.');
        return;
      }

      // Validação estrita para proibir valores negativos
      if (isNaN(salarioValor) || salarioValor < 0) {
        alert('O salário informado não pode ser negativo.');
        return;
      }

      const funcionario = {
        cpf: document.getElementById('cpf').value.trim(),
        nome: document.getElementById('nome').value.trim(),
        cargo: cargoSelecionado,
        salario: salarioValor
      };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(funcionario)
        });

        if (response.ok) {
          e.target.reset();
          carregarFuncionarios();
        } else {
          const erro = await response.json();
          alert(`Erro ao salvar: ${erro.message || 'Verifique os dados informados.'}`);
        }
      } catch (err) {
        alert('Erro de conexão com o servidor.');
      }
    });

    // 3. Excluir Funcionário (DELETE)
    async function deletarFuncionario(cpf) {
      if (confirm(`Deseja realmente excluir o funcionário com CPF ${cpf}?`)) {
        try {
          const response = await fetch(`${API_URL}/${cpf}`, { method: 'DELETE' });
          if (response.ok) {
            carregarFuncionarios();
          } else {
            alert('Não foi possível excluir o funcionário.');
          }
        } catch (err) {
          alert('Erro ao conectar com o servidor ao tentar excluir.');
        }
      }
    }

    // Inicializa a tabela ao carregar a página
    carregarFuncionarios();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
