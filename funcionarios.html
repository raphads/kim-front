<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Gestão de Funcionários</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.7/jquery.inputmask.min.js"></script>
</head>
<body>

  <header class="py-3 mb-4" style="background-color: var(--navy-dark); border-bottom: 3px solid var(--orange-hover);">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Gestão de Funcionários</h4>
      </div>
      <div class="d-flex gap-2">
        <a href="piloto.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-flag-fill me-1"></i> Pilotos
        </a>
        <a href="index.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-house-door-fill me-1"></i> Início
        </a>
      </div>
    </div>
  </header>

  <main class="container mb-5">
    <div class="row g-4">
      
      <div class="col-lg-4">
        <div class="container-card">
          <h2>Cadastrar Funcionário</h2>
          <form id="formFuncionario">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Nome do funcionário" required>

            <label for="cargo">Cargo</label>
            <input type="text" id="cargo" placeholder="Ex: Pista, Atendimento, Mecânico" required>

            <div class="row">
             <!-- <div class="col-6">
                <label for="turno">Turno</label>
                <select id="turno" style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 15px;">
                  <option value="Manhã">Manhã</option>
                  <option value="Tarde">Tarde</option>
                  <option value="Noite">Noite</option>
                </select>
              </div>-->
              <div class="col-6">
                <label for="salario">Salário (R$)</label>
                <input type="number" id="salario" step="0.01" placeholder="0.00">
              </div>
            </div>

            <button type="submit" class="btn-salvar w-100 mt-2">
              <i class="bi bi-check-circle-fill me-1"></i> Salvar Funcionário
            </button>
          </form>
        </div>
      </div>

      <div class="col-lg-8">
        <div class="container-tabela">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Quadro de Funcionários</h2>
          </div>
          
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>CPF</th>
                  <th>Nome</th>
                  <th>Cargo</th>
                  <!-- <th>Turno</th>-->
                  <th>Salário</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaFuncionarios">
                </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api/funcionarios';

    // 1. Listar Funcionários (GET)   <td>${f.turno || '-'}</td>
    async function carregarFuncionarios() {
      try {
        const res = await fetch(API_URL);
        const funcionarios = await res.json();
        
        const tbody = document.getElementById('tabelaFuncionarios');
        if (!funcionarios || funcionarios.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Nenhum funcionário cadastrado.</td></tr>';
          return;
        }

        tbody.innerHTML = funcionarios.map(f => `
          <tr>
            <td><strong>${f.cpf}</strong></td>
            <td>${f.nome}</td>
            <td><span class="badge bg-primary fs-6">${f.cargo}</span></td>
          
            <td>R$ ${Number(f.salario || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2 })}</td>
            <td>
              <button class="btn-delete" onclick="deletarFuncionario('${f.cpf}')">
                <i class="bi bi-trash-fill"></i> Excluir
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Erro ao carregar funcionários:', err);
      }
    }

    // 2. Salvar/Atualizar Funcionário (POST)
    document.getElementById('formFuncionario').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const funcionario = {
        cpf: document.getElementById('cpf').value,
        nome: document.getElementById('nome').value,
        cargo: document.getElementById('cargo').value,
       // turno: document.getElementById('turno').value,
        salario: Number(document.getElementById('salario').value)
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(funcionario)
        });

        e.target.reset();
        carregarFuncionarios();
      } catch (err) {
        alert('Erro ao salvar funcionário no servidor.');
      }
    });

    // 3. Excluir Funcionário (DELETE)
    async function deletarFuncionario(cpf) {
      if (confirm('Deseja realmente excluir este funcionário?')) {
        try {
          await fetch(`${API_URL}/${cpf}`, { method: 'DELETE' });
          carregarFuncionarios();
        } catch (err) {
          alert('Erro ao excluir funcionário.');
        }
      }
    }

    carregarFuncionarios();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
