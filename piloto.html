<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Gestão de Pilotos</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.7/jquery.inputmask.min.js"></script>
  <script src="kim.js" defer></script>
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="py-3 mb-4" style="background-color: var(--navy-dark); border-bottom: 3px solid var(--orange-hover);">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Gestão de Pilotos</h4>
      </div>
      <a href="index.html" class="btn btn-outline-light rounded-pill px-3">
        <i class="bi bi-house-door-fill me-1"></i> Início
      </a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container mb-5">
    <div class="row g-4">
      
      <!-- FORMULÁRIO -->
      <div class="col-lg-4">
        <div class="container-card">
          <h2>Cadastrar Piloto</h2>
          <form id="formPiloto">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite o nome" required>

            <label for="dataNasc">Data de Nascimento</label>
            <input type="date" id="dataNasc" required>

            <label for="equipe">Equipe</label>
            <input type="text" id="equipe" placeholder="Nome da equipe">

            <div class="row">
              <div class="col-6">
                <label for="idade">Idade</label>
                <input type="number" id="idade" placeholder="Ex: 25" min="10">
              </div>
              <div class="col-6">
                <label for="numero">Nº Kart</label>
                <input type="number" id="numero" placeholder="Ex: 12" min="0">
              </div>
            </div>

            <button type="submit" class="btn-salvar w-100 mt-2">
              <i class="bi bi-check-circle-fill me-1"></i> Salvar Piloto
            </button>
          </form>
        </div>
      </div>

      <!-- TABELA -->
      <div class="col-lg-8">
        <div class="container-tabela">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Lista de Pilotos</h2>
          </div>
          
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>CPF</th>
                  <th>Nome</th>
                  <th>Equipe</th>
                  <th>Idade</th>
                  <th>Nº Kart</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaPilotos">
                <!-- Preenchido via JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api/pilotos';

    // 1. Listar Pilotos (GET)
    async function carregarPilotos() {
      try {
        const res = await fetch(API_URL);
        const pilotos = await res.json();
        
        const tbody = document.getElementById('tabelaPilotos');
        if (pilotos.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Nenhum piloto cadastrado.</td></tr>';
          return;
        }

        tbody.innerHTML = pilotos.map(p => `
          <tr>
            <td><strong>${p.cpf}</strong></td>
            <td>${p.nome}</td>
            <td>${p.equipe || '-'}</td>
            <td>${p.idade}</td>
            <td><span class="badge bg-secondary fs-6">${p.numero}</span></td>
            <td>
              <button class="btn-delete" onclick="deletarPiloto('${p.cpf}')">
                <i class="bi bi-trash-fill"></i> Excluir
              </button>
            </td>
          </tr>
        `).join('');
      } catch (err) {
        console.error('Erro ao carregar pilotos:', err);
      }
    }

    // 2. Salvar/Atualizar Piloto (POST)
    document.getElementById('formPiloto').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const piloto = {
        cpf: document.getElementById('cpf').value,
        nome: document.getElementById('nome').value,
        dataNasc: document.getElementById('dataNasc').value,
        equipe: document.getElementById('equipe').value,
        idade: Number(document.getElementById('idade').value),
        numero: Number(document.getElementById('numero').value)
      };

      try {
        await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(piloto)
        });

        e.target.reset();
        carregarPilotos();
      } catch (err) {
        alert('Erro ao salvar piloto no servidor.');
      }
    });

    // 3. Excluir Piloto (DELETE)
    async function deletarPiloto(cpf) {
      if (confirm('Deseja realmente excluir este piloto?')) {
        try {
          await fetch(`${API_URL}/${cpf}`, { method: 'DELETE' });
          carregarPilotos();
        } catch (err) {
          alert('Erro ao excluir piloto.');
        }
      }
    }

    carregarPilotos();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
