<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Gestão de Pilotos</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.inputmask/5.0.7/jquery.inputmask.min.js"></script>
  <script src="kim.js" defer></script>
</head>
<body>

  <!-- CABEÇALHO -->
  <header class="py-3 mb-4" style="background-color: var(--navy-dark); border-bottom: 3px solid var(--orange-hover);">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Gestão de Pilotos</h4>
      </div>
      <a href="index.html" class="btn btn-outline-light rounded-pill px-3">
        <i class="bi bi-house-door-fill me-1"></i> Início
      </a>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="container mb-5">
    <div class="row g-4">
      
      <!-- FORMULÁRIO -->
      <div class="col-lg-4">
        <div class="container-card">
          <h2>Cadastrar Piloto</h2>
          <form id="formPiloto">

            <!-- Upload de Foto em Base64 com Preview -->
            <div class="text-center mb-3">
              <label class="form-label d-block fw-bold mb-2">Foto do Piloto</label>
              <div class="d-inline-block position-relative">
                <img id="previewFoto" src="foto1.jpg" alt="Foto Piloto" class="rounded-circle border shadow-sm" style="width: 120px; height: 120px; object-fit: cover; cursor: pointer;">
                <input type="file" id="fotoInput" accept="image/*" class="d-none">
              </div>
              <div class="mt-2">
                <button type="button" class="btn btn-sm btn-outline-secondary" onclick="document.getElementById('fotoInput').click()">
                  <i class="bi bi-camera-fill me-1"></i> Selecionar Foto
                </button>
              </div>
            </div>

            <label for="cpf">CPF</label>
            <input type="text" id="cpf" placeholder="000.000.000-00" required>

            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" placeholder="Digite o nome" required>

            <label for="dataNasc">Data de Nascimento</label>
            <input type="date" id="dataNasc" required>

            <label for="equipe">Equipe</label>
            <input type="text" id="equipe" placeholder="Nome da equipe">

            <div class="row">
               <div class="col-6">
                <label for="numero">Nº Kart</label>
                <input type="number" id="numero" placeholder="Ex: 12" min="0" required>
              </div>
              <div class="col-6">
                <label for="idade" style="visibility: hidden;">Idade</label>
                <input type="number" id="idade" placeholder="Ex: 25" min="10" style="visibility: hidden;">
              </div>
            </div>

            <button type="submit" class="btn-salvar w-100 mt-2">
              <i class="bi bi-check-circle-fill me-1"></i> Salvar Piloto
            </button>
          </form>
        </div>
      </div>

      <!-- TABELA -->
      <div class="col-lg-8">
        <div class="container-tabela">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="m-0">Lista de Pilotos</h2>
          </div>
          
          <div class="table-responsive">
            <table>
              <thead>
                <tr>
                  <th>Foto</th>
                  <th>CPF</th>
                  <th>Nome</th>
                  <th>Equipe</th>
                  <th>Nº Kart</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody id="tabelaPilotos">
                <!-- Preenchido via JavaScript -->
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    const API_URL = 'http://localhost:3000/api/pilotos';

    // 1. Preview da Imagem ao Selecionar Arquivo
    const fotoInput = document.getElementById('fotoInput');
    const previewFoto = document.getElementById('previewFoto');

    fotoInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          previewFoto.src = event.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Função para converter arquivo de imagem para Base64
    function converterParaBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
      });
    }

    // 2. Listar Pilotos (GET)
    async function carregarPilotos() {
      try {
        const res = await fetch(API_URL);
        const pilotos = await res.json();
        
        const tbody = document.getElementById('tabelaPilotos');
        if (pilotos.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-center text-muted py-3">Nenhum piloto cadastrado.</td></tr>';
          return;
        }

        tbody.innerHTML = pilotos.map(p => {
          const fotoHtml = p.foto 
            ? `<img src="${p.foto}" alt="${p.nome}" class="rounded-circle" width="40" height="40" style="object-fit: cover;">`
            : `<i class="bi bi-person-circle fs-3 text-secondary"></i>`;

          return `
            <tr>
              <td>${fotoHtml}</td>
              <td><strong>${p.cpf}</strong></td>
              <td>${p.nome}</td>
              <td>${p.equipe || '-'}</td>
              <td><span class="badge bg-secondary fs-6">${p.numero}</span></td>
              <td>
                <button class="btn-delete" onclick="deletarPiloto('${p.cpf}')">
                  <i class="bi bi-trash-fill"></i> Excluir
                </button>
              </td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        console.error('Erro ao carregar pilotos:', err);
      }
    }

    // 3. Salvar/Atualizar Piloto (POST)
    document.getElementById('formPiloto').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      let fotoBase64 = null;

      if (fotoInput.files.length > 0) {
        fotoBase64 = await converterParaBase64(fotoInput.files[0]);
      }

      const piloto = {
        cpf: document.getElementById('cpf').value,
        nome: document.getElementById('nome').value,
        dataNasc: document.getElementById('dataNasc').value,
        equipe: document.getElementById('equipe').value,
        idade: Number(document.getElementById('idade').value) || 0,
        numero: Number(document.getElementById('numero').value),
        foto: fotoBase64
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(piloto)
        });

        if (!res.ok) throw new Error('Erro na requisição');
alert('Piloto cadastrado com sucesso!');
        e.target.reset();
        previewFoto.src = 'foto1.jpg'; // Reseta o preview para a foto padrão
        carregarPilotos();
      } catch (err) {
        alert('Erro ao salvar piloto no servidor.');
      }
    });

    // 4. Excluir Piloto (DELETE)
    async function deletarPiloto(cpf) {
      if (confirm('Deseja realmente excluir este piloto?')) {
        try {
          await fetch(`${API_URL}/${cpf}`, { method: 'DELETE' });
          carregarPilotos();
        } catch (err) {
          alert('Erro ao excluir piloto.');
        }
      }
    }

    carregarPilotos();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
