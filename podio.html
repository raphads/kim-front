<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartódromo - Definir Pódio do Campeonato</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card-custom { max-width: 700px; margin: 40px auto; border-radius: 12px; }
        .podium-1 { border-left: 5px solid #ffc107; } /* Ouro */
        .podium-2 { border-left: 5px solid #6c757d; } /* Prata */
        .podium-3 { border-left: 5px solid #cd7f32; } /* Bronzear */
    </style>
</head>
<body>

<div class="container">
    <div class="card card-custom shadow-sm p-4">
        <h3 class="mb-4 text-center">🏁 Finalizar Campeonato & Pódio</h3>

        <form id="podiumForm">
            <!-- Seleção do Campeonato Ativo -->
            <div class="mb-3">
                <label for="selectCampeonato" class="form-label fw-bold">Selecione o Campeonato Saved:</label>
                <select id="selectCampeonato" class="form-select" required>
                    <option value="">Carregando campeonatos...</option>
                </select>
            </div>

            <hr class="my-4">

            <h5 class="mb-3">🏆 Definir Pódio</h5>

            <!-- 1º Lugar -->
            <div class="mb-3 p-2 bg-light podium-1 rounded">
                <label for="selectPrimeiro" class="form-label fw-bold">🥇 1º Lugar</label>
                <select id="selectPrimeiro" class="form-select piloto-select" required>
                    <option value="">Selecione o Piloto...</option>
                </select>
            </div>

            <!-- 2º Lugar -->
            <div class="mb-3 p-2 bg-light podium-2 rounded">
                <label for="selectSegundo" class="form-label fw-bold">🥈 2º Lugar</label>
                <select id="selectSegundo" class="form-select piloto-select" required>
                    <option value="">Selecione o Piloto...</option>
                </select>
            </div>

            <!-- 3º Lugar -->
            <div class="mb-3 p-2 bg-light podium-3 rounded">
                <label for="selectTerceiro" class="form-label fw-bold">🥉 3º Lugar</label>
                <select id="selectTerceiro" class="form-select piloto-select" required>
                    <option value="">Selecione o Piloto...</option>
                </select>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-success btn-lg">Salvar Histórico & Finalizar</button>
            </div>
        </form>
    </div>
</div>

<script>
  const API_URL = 'http://localhost:3000/api';

async function carregarCampeonatos() {
    try {
        // A rota do seu backend é /api/campeonatos (não /api/pistas)
        const res = await fetch(`${API_URL}/campeonatos`);
        const campeonatos = await res.json();
        
        const select = document.getElementById('selectCampeonato');
        select.innerHTML = '<option value="">-- Escolha um campeonato --</option>';

        campeonatos.forEach(c => {
            const opt = document.createElement('option');
            // O Prisma retorna 'nome' e 'voltas'
            opt.value = c.nome;
            opt.dataset.voltas = c.voltas || 0;
            opt.textContent = `${c.nome} (${c.voltas || 0} voltas)`;
            select.appendChild(opt);
        });
    } catch (err) {
        alert('Erro ao carregar campeonatos da API.');
    }
}

async function carregarPilotos() {
    try {
        const res = await fetch(`${API_URL}/pilotos`);
        const pilotosData = await res.json();

        const selects = document.querySelectorAll('.piloto-select');
        
        selects.forEach(select => {
            select.innerHTML = '<option value="">-- Escolha o piloto --</option>';
            pilotosData.forEach(p => {
                const opt = document.createElement('option');
                // O Prisma retorna 'nome' e 'foto' (não nome_piloto e foto_piloto)
                opt.value = p.nome;
                opt.dataset.foto = p.foto || '';
                opt.textContent = p.nome;
                select.appendChild(opt);
            });
        });
    } catch (err) {
        alert('Erro ao carregar pilotos da API.');
    }
}
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
