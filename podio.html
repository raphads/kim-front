<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <script src="auth.js">  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kartódromo Mauá - Definir Pódio</title>
  
  <link rel="icon" href="LOGO1.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="style.css">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body class="d-flex flex-column min-vh-100">

   <!-- CABEÇALHO -->
  <header class="py-3 mb-4" style="background-color: #0b1d3a; border-bottom: 3px solid #ff6b00;">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <img src="LOGO1.png" alt="Kartódromo Mauá" height="50">
        <h4 class="m-0 fw-bold text-white">Finalizar Campeonato &amp; Pódio</h4>
      </div>
      <div class="d-flex gap-2">
        <a href="campeonatos.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-trophy-fill me-1"></i> Campeonatos
        </a>
        <a href="piloto.html" class="btn btn-outline-light rounded-pill px-3 fs-6">
          <i class="bi bi-person-badge-fill me-1"></i> Pilotos
        </a>
      </div>
    </div>
  </header>

  <!-- FORMULÁRIO E LISTAGEM -->
  <main class="container my-auto pb-5">
    <div class="row justify-content-center mb-5">
      <div class="col-lg-8">
        <div class="card p-4 shadow-sm border-0 rounded-3">
          <h2 class="fw-bold mb-4"><i class="bi bi-flag-fill text-warning me-2"></i>Registrar Pódio da Etapa</h2>
          
          <form id="podiumForm">
            <div class="mb-4">
              <label for="selectCampeonato" class="form-label fw-semibold">Selecione o Campeonato</label>
              <select id="selectCampeonato" class="form-select">
                <option value="">Carregando campeonatos...</option>
              </select>
            </div>

            <hr class="my-4">

            <h5 class="fw-bold mb-3 text-secondary">
              <i class="bi bi-award-fill me-1"></i> Posições do Pódio
            </h5>

            <div class="p-3 mb-3 rounded-3" style="background-color: #fff9e6; border-left: 6px solid #ffc107;">
              <label for="selectPrimeiro" class="fw-bold text-dark mb-1">🥇 1º Lugar (Campeão)</label>
              <select id="selectPrimeiro" class="form-select piloto-select">
                <option value="">Carregando pilotos...</option>
              </select>
            </div>

            <div class="p-3 mb-3 rounded-3" style="background-color: #f1f3f5; border-left: 6px solid #6c757d;">
              <label for="selectSegundo" class="fw-bold text-dark mb-1">🥈 2º Lugar</label>
              <select id="selectSegundo" class="form-select piloto-select">
                <option value="">Carregando pilotos...</option>
              </select>
            </div>

            <div class="p-3 mb-4 rounded-3" style="background-color: #fdf3e7; border-left: 6px solid #cd7f32;">
              <label for="selectTerceiro" class="fw-bold text-dark mb-1">🥉 3º Lugar</label>
              <select id="selectTerceiro" class="form-select piloto-select">
                <option value="">Carregando pilotos...</option>
              </select>
            </div>

            <button type="submit" class="btn btn-warning text-dark fw-bold w-100 py-3 fs-5">
              <i class="bi bi-check-circle-fill me-2"></i>Salvar Histórico &amp; Finalizar
            </button>
          </form>
        </div>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-10">
        <div class="card shadow-sm p-4 border-0 rounded-3">
          <h3 class="fw-bold mb-4">
            <i class="bi bi-list-stars me-2 text-primary"></i>Histórico de Pódios Registrados
          </h3>
          <div class="table-responsive">
            <table class="table table-hover align-middle">
              <thead class="table-dark">
                <tr>
                  <th>Campeonato</th>
                  <th>Voltas</th>
                  <th>🥇 1º Lugar</th>
                  <th>🥈 2º Lugar</th>
                  <th>🥉 3º Lugar</th>
                </tr>
              </thead>
              <tbody id="tabelaHistoricoBody">
                <tr>
                  <td colspan="5" class="text-center">Carregando histórico...</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script nonce="" style="display: none;" data-script-executed="true">
    const API_URL = 'http://localhost:3000/api';

    document.addEventListener('DOMContentLoaded', () => {
      carregarCampeonatos();
      carregarPilotos();
      carregarHistorico();
    });

    async function carregarCampeonatos() {
      try {
        const res = await fetch(`${API_URL}/campeonatos`);
        if (!res.ok) throw new Error(`Status: ${res.status}`);
        
        const campeonatos = await res.json();
        const select = document.getElementById('selectCampeonato');
        select.innerHTML = '<option value="">-- Escolha um campeonato --</option>';

        campeonatos.forEach(c => {
          const opt = document.createElement('option');
          opt.value = c.nome;
          opt.textContent = `${c.nome} (${c.voltas || 0} voltas)`;
          select.appendChild(opt);
        });
      } catch (err) {
        console.error('Erro ao carregar campeonatos:', err);
      }
    }

    async function carregarPilotos() {
      try {
        const res = await fetch(`${API_URL}/pilotos`);
        if (!res.ok) throw new Error(`Status: ${res.status}`);

        const pilotosData = await res.json();
        const selects = document.querySelectorAll('.piloto-select');
        
        selects.forEach(select => {
          select.innerHTML = '<option value="">-- Escolha o piloto --</option>';
          pilotosData.forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.nome;
            opt.textContent = p.nome;
            select.appendChild(opt);
          });
        });
      } catch (err) {
        console.error('Erro ao carregar pilotos:', err);
      }
    }

    async function carregarHistorico() {
      try {
        const res = await fetch(`${API_URL}/historico`);
        if (!res.ok) throw new Error(`Status: ${res.status}`);

        const historicos = await res.json();
        const tbody = document.getElementById('tabelaHistoricoBody');
        tbody.innerHTML = '';

        if (historicos.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted">Nenhum pódio registrado até o momento.</td></tr>';
          return;
        }

        historicos.forEach(h => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="fw-bold">${h.nomeCampeonato}</td>
            <td><span class="badge bg-secondary">${h.numeroVoltas} voltas</span></td>
            <td><span class="fw-semibold text-warning-emphasis">🥇 ${h.nomePrimeiro || '-'}</span></td>
            <td><span class="fw-semibold text-secondary">🥈 ${h.nomeSegundo || '-'}</span></td>
            <td><span class="fw-semibold text-danger-emphasis">🥉 ${h.nomeTerceiro || '-'}</span></td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        console.error('Erro ao carregar histórico:', err);
      }
    }

    document.getElementById('podiumForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const nomeCampeonato = document.getElementById('selectCampeonato').value;
      const nomePrimeiro = document.getElementById('selectPrimeiro').value;
      const nomeSegundo = document.getElementById('selectSegundo').value;
      const nomeTerceiro = document.getElementById('selectTerceiro').value;

      if (nomePrimeiro === nomeSegundo || nomePrimeiro === nomeTerceiro || nomeSegundo === nomeTerceiro) {
        alert('Selecione pilotos diferentes para cada posição do pódio!');
        return;
      }

      try {
        const res = await fetch(`${API_URL}/historico`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ 
            nomeCampeonato, 
            nomePrimeiro, 
            nomeSegundo, 
            nomeTerceiro 
          })
        });

        if (res.ok) {
          alert('Histórico e pódio salvos com sucesso!');
          document.getElementById('podiumForm').reset();
          carregarHistorico();
        } else {
          const errData = await res.json();
          alert(errData.error || 'Erro ao salvar no histórico.');
        }
      } catch (err) {
        console.error('Erro ao enviar pódio:', err);
        alert('Falha ao conectar com a API.');
      }
    });
  </script>

</body>
</html>
